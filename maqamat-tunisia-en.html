body{margin:0;background:#F3E5C8}
a{color:#7E3A1E}a:hover{color:#A4502A}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #7E3A1E;outline-offset:2px}
@keyframes sea-drift{from{transform:translate(0,0)}to{transform:translate(-192px,128px)}}
@keyframes sea-drift-m{from{transform:translate(0,0)}to{transform:translate(-134.4px,89.6px)}}
@keyframes sea-swell{0%,100%{transform:translate(0,0)}50%{transform:translate(0,5px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.42)}}
@keyframes fly{0%{transform:translate(-40px,-8px);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(60px,10px);opacity:0}}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(-3.5deg)}25%{transform:translate(2px,4px) rotate(0deg)}50%{transform:translate(0,7px) rotate(3.5deg)}75%{transform:translate(-2px,3px) rotate(0deg)}}
.sea-drift{animation:sea-drift 32s linear infinite}.sea-drift-m{animation:sea-drift-m 32s linear infinite}.sea-swell{animation:sea-swell 7s ease-in-out infinite}
.wing-near{transform-box:fill-box;transform-origin:85% 95%;animation:flap 1.3s ease-in-out infinite}.wing-far{transform-box:fill-box;transform-origin:95% 92%;animation:flap 1.3s ease-in-out infinite}
.bird-fly{animation:fly 16s linear infinite}.ship-bob{transform-origin:50% 82%;animation:bob 4s ease-in-out infinite}
@keyframes ev-pulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes ev-flicker{0%,100%{opacity:1;transform:scale(1)}40%{opacity:.7;transform:scale(.86)}62%{opacity:1;transform:scale(1.08)}}
@keyframes ev-halo{0%,100%{opacity:.95}50%{opacity:.5}}
.ev-ring{border-radius:50%;border:2px solid currentColor;box-sizing:border-box;animation:ev-pulse 2.4s ease-out infinite}.ev-ring2{animation-delay:1.2s}
.ev-core{animation:ev-flicker 1.7s ease-in-out infinite}.ev-halo{animation:ev-halo 1.7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sea-drift,.sea-drift-m,.sea-swell,.wing-near,.wing-far,.bird-fly,.ship-bob,.ev-ring,.ev-core,.ev-halo{animation:none!important}.ev-ring{opacity:.45}}
</style>
